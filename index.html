<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>HTML运行工具</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--blue:#3558e0;--ink:#1e2a44;--mute:#64748b;--line:#e2e8f0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#f8fafc;color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.hero{padding:calc(28px + env(safe-area-inset-top,0px)) 20px 26px;background:linear-gradient(135deg,#fff 0%,#eef3fe 100%);border-bottom:1px solid var(--line)}
.wrap{max-width:960px;margin:0 auto}
.hero h1{font-size:clamp(30px,6vw,44px);font-weight:800;letter-spacing:-.5px;line-height:1.2}
.hero p{margin-top:12px;color:var(--mute);font-size:16px;max-width:640px}
.content{max-width:960px;margin:0 auto;padding:20px 20px 0}
.notice{display:flex;gap:12px;padding:16px 18px;background:#eef3fe;border:1px solid #cddcf3;border-radius:14px;color:#25348a;font-size:15px}
.notice .i{flex-shrink:0;margin-top:3px;width:18px;height:18px}
.card{margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 6px 24px rgba(15,23,42,.05);overflow:hidden}
.card-body{padding:22px}
.card h2{font-size:20px;font-weight:700}
.link-btn{margin-top:8px;display:inline-block;background:none;border:none;font:inherit;font-size:14.5px;color:#2f55c4;cursor:pointer;padding:2px 0}
.link-btn:hover{text-decoration:underline}
textarea{display:block;width:100%;height:420px;margin-top:10px;padding:16px;font:15px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--ink);background:#fff;border:1.5px solid #d5dbe5;border-radius:14px;resize:vertical;outline:none;tab-size:2;-webkit-text-size-adjust:100%}
textarea::placeholder{color:#a3acba}
textarea:focus{border-color:#7b97f0;box-shadow:0 0 0 3px rgba(53,88,224,.12)}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:20px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;font:inherit;font-size:15.5px;font-weight:600;color:#334155;background:#fff;border:1px solid #d5dbe5;border-radius:12px;cursor:pointer;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{background:#f8fafc;border-color:#b6c0d0}
.btn:active{transform:scale(.97)}
.btn .i{width:18px;height:18px}
.btn.primary{color:#fff;background:var(--blue);border-color:var(--blue)}
.btn.primary:hover{background:#2c4acb}
.btn.soft{color:#2a46b8;background:#dde7fc;border-color:#a9bff0}
.btn.soft:hover{background:#cfdcfa}
.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.result-head{padding:20px 22px 16px}
.check{display:inline-flex;align-items:center;gap:10px;margin-top:12px;padding:10px 16px;font-size:15.5px;font-weight:500;background:#f8fafc;border:1px solid var(--line);border-radius:12px;cursor:pointer;user-select:none}
.check input{width:18px;height:18px;accent-color:var(--blue)}
.stage{position:relative;min-height:480px;background:#f8fafc;border-top:1px solid var(--line)}
#frame{display:none;width:100%;height:520px;border:0;background:#fff}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.empty h3{font-size:19px;font-weight:700}
.empty p{margin-top:10px;max-width:340px;color:var(--mute);font-size:15px}
.stage.has-result .empty{display:none}
.stage.has-result #frame{display:block}
.console{display:none;background:#0f172a;color:#e2e8f0;border-top:1px solid #1e293b}
.console.show{display:block}
.console-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;font-size:13px;font-weight:600;color:#94a3b8;border-bottom:1px solid #1e293b}
.console-bar button{font:inherit;font-size:12.5px;color:#cbd5e1;background:#1e293b;border:none;border-radius:6px;padding:3px 10px;cursor:pointer}
#logs{max-height:220px;overflow:auto;padding:8px 0;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
#logs div{padding:3px 16px;white-space:pre-wrap;word-break:break-all;border-bottom:1px solid rgba(148,163,184,.08)}
#logs .warn{color:#fcd34d;background:rgba(250,204,21,.08)}
#logs .error{color:#fca5a5;background:rgba(248,113,113,.1)}
#logs .info{color:#93c5fd}
#logs .none{color:#64748b}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);padding:10px 18px;background:rgba(15,23,42,.92);color:#fff;font-size:14px;border-radius:10px;opacity:0;pointer-events:none;transition:all .2s;z-index:50;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<div class="hero"><div class="wrap">
  <h1>HTML运行工具</h1>
  <p>在线输入HTML代码后，可一键在页面内运行并预览页面效果，帮助你快速测试标签结构、排版布局与基础页面展示结果。</p>
</div></div>

<div class="content">
  <div class="notice">
    <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
    <span>代码只在你的浏览器本地运行，不会上传到任何服务器。输入内容会自动保存在本机，刷新后仍然保留。</span>
  </div>

  <section class="card"><div class="card-body">
    <h2>HTML 代码输入</h2>
    <button class="link-btn" id="sampleBtn" type="button">示例代码</button>
    <textarea id="code" placeholder="请粘贴HTML代码..." spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>
    <div class="actions">
      <button class="btn primary" id="runBtn" type="button"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>运行预览</button>
      <button class="btn" id="openBtn" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>新窗口运行</button>
      <button class="btn" id="copyBtn" type="button"><svg class="i" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>复制代码</button>
      <button class="btn" id="downloadBtn" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>下载 HTML</button>
      <button class="btn soft" id="resetBtn" type="button"><svg class="i" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>重置</button>
    </div>
  </div></section>

  <section class="card">
    <div class="result-head">
      <h2>运行结果预览</h2>
      <label class="check"><input type="checkbox" id="consoleToggle">显示控制台</label>
    </div>
    <div class="stage" id="stage">
      <iframe id="frame" title="运行结果" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"></iframe>
      <div class="empty">
        <h3>暂无运行结果</h3>
        <p>请输入 HTML 代码后点击“运行预览”或“新窗口运行”。</p>
      </div>
    </div>
    <div class="console" id="console">
      <div class="console-bar"><span>控制台</span><button type="button" id="clearLogs">清空</button></div>
      <div id="logs"><div class="none">暂无输出</div></div>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const code = $('code'), frame = $('frame'), stage = $('stage'), logs = $('logs');
const STORE = 'html-runner:code';

const SAMPLE = `<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>示例页面</title>
<style>
  body { font-family: sans-serif; text-align: center; padding: 40px 16px; background: #f1f5f9; }
  h1 { color: #1e2a44; }
  button { padding: 12px 24px; font-size: 18px; color: #fff; background: #3558e0; border: 0; border-radius: 10px; }
  #n { font-size: 56px; margin: 20px 0; }
</style>
</head>
<body>
  <h1>Hello, HTML!</h1>
  <div id="n">0</div>
  <button id="add">点我 +1</button>
  <script>
    var n = 0;
    document.getElementById('add').onclick = function () {
      n++;
      document.getElementById('n').textContent = n;
      console.log('当前计数：', n);
    };
  <\/script>
</body>
</html>`;

/* ---------- 工具函数 ---------- */
let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

// 注入到预览页面里的控制台钩子（会被 toString 后写进页面）
function hook() {
  function fmt(v) {
    if (v instanceof Error) return v.stack || String(v);
    if (typeof v === 'object' && v !== null) { try { return JSON.stringify(v, null, 2); } catch (e) {} }
    return String(v);
  }
  function post(t, args) {
    try { parent.postMessage({__runhtml: 1, t: t, m: Array.prototype.map.call(args, fmt).join(' ')}, '*'); } catch (e) {}
  }
  ['log', 'info', 'warn', 'error', 'debug'].forEach(function (k) {
    var orig = console[k];
    console[k] = function () { post(k, arguments); orig.apply(console, arguments); };
  });
  addEventListener('error', function (e) {
    post('error', [e.message + (e.lineno ? '（第 ' + e.lineno + ' 行）' : '')]);
  });
  addEventListener('unhandledrejection', function (e) {
    post('error', ['未处理的 Promise 错误：' + (e.reason && e.reason.message || e.reason)]);
  });
}
const HOOK_TAG = '<script>(' + hook.toString() + ')();<\/script>';

// 把钩子插到 <head> 之后（没有就退而求其次），避免破坏 DOCTYPE
function withHook(src) {
  let m = /<head[^>]*>/i.exec(src) || /<html[^>]*>/i.exec(src) || /<!doctype[^>]*>/i.exec(src);
  if (!m) return HOOK_TAG + src;
  const at = m.index + m[0].length;
  return src.slice(0, at) + HOOK_TAG + src.slice(at);
}

function hasCode() {
  if (code.value.trim()) return true;
  toast('请先输入 HTML 代码');
  code.focus();
  return false;
}

/* ---------- 控制台 ---------- */
function clearLogs() { logs.innerHTML = '<div class="none">暂无输出</div>'; }
function addLog(type, text) {
  if (logs.firstChild && logs.firstChild.className === 'none') logs.innerHTML = '';
  const d = document.createElement('div');
  d.className = type;
  d.textContent = text;
  logs.appendChild(d);
  while (logs.children.length > 500) logs.removeChild(logs.firstChild);
  logs.scrollTop = logs.scrollHeight;
}
window.addEventListener('message', function (e) {
  if (e.source !== frame.contentWindow || !e.data || !e.data.__runhtml) return;
  addLog(e.data.t, e.data.m);
});
$('consoleToggle').addEventListener('change', function () {
  $('console').classList.toggle('show', this.checked);
});
$('clearLogs').addEventListener('click', clearLogs);

/* ---------- 按钮 ---------- */
function run() {
  if (!hasCode()) return;
  clearLogs();
  frame.srcdoc = withHook(code.value);
  stage.classList.add('has-result');
  if (window.innerWidth < 880) stage.scrollIntoView({behavior: 'smooth', block: 'start'});
}

function openNew() {
  if (!hasCode()) return;
  const url = URL.createObjectURL(new Blob([code.value], {type: 'text/html;charset=utf-8'}));
  const w = window.open(url, '_blank');
  if (!w) toast('浏览器拦截了新窗口，请允许弹出窗口');
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

async function copy() {
  if (!hasCode()) return;
  let ok = false;
  try { await navigator.clipboard.writeText(code.value); ok = true; }
  catch (e) {
    code.select(); code.setSelectionRange(0, code.value.length);
    try { ok = document.execCommand('copy'); } catch (_) {}
  }
  toast(ok ? '已复制到剪贴板' : '复制失败，请手动选中复制');
}

function download() {
  if (!hasCode()) return;
  const url = URL.createObjectURL(new Blob([code.value], {type: 'text/html;charset=utf-8'}));
  const a = document.createElement('a');
  a.href = url;
  a.download = 'index.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function reset() {
  code.value = '';
  frame.removeAttribute('srcdoc');
  frame.src = 'about:blank';
  stage.classList.remove('has-result');
  clearLogs();
  save();
  code.focus();
}

$('runBtn').addEventListener('click', run);
$('openBtn').addEventListener('click', openNew);
$('copyBtn').addEventListener('click', copy);
$('downloadBtn').addEventListener('click', download);
$('resetBtn').addEventListener('click', reset);
$('sampleBtn').addEventListener('click', function () {
  code.value = SAMPLE;
  save();
  toast('已填入示例代码');
});

/* Ctrl/Cmd + Enter 运行；Tab 插入缩进 */
code.addEventListener('keydown', function (e) {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); run(); }
  else if (e.key === 'Tab' && !e.shiftKey) {
    e.preventDefault();
    const s = code.selectionStart;
    code.setRangeText('  ', s, code.selectionEnd, 'end');
    save();
  }
});

/* ---------- 本地自动保存 ---------- */
let saveTimer;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function () {
    try { localStorage.setItem(STORE, code.value); } catch (e) {}
  }, 300);
}
code.addEventListener('input', save);
try { code.value = localStorage.getItem(STORE) || ''; } catch (e) {}
</script>
</body>
</html>
